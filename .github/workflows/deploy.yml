name: Build and Deploy to AWS ECR

on:
  push:
    branches:
      - main
      - master  # Hỗ trợ cả nhánh master và main để kích hoạt pipeline

env:
  AWS_REGION: ap-southeast-1                  # Thay đổi thành region của bạn (ví dụ: ap-southeast-1, us-east-1...)
  ECR_REPOSITORY: w6-prod-backend-repo       # Tên ECR Repository của bạn đã tạo trên AWS
  ASG_NAME: w6-prod-asg                      # Tên Auto Scaling Group của bạn (dùng để trigger refresh EC2)

jobs:
  deploy:
    name: Build & Push to ECR
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout mã nguồn
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Setup Node.js để chạy test trước khi build (Đảm bảo code không lỗi)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './package-lock.json' # Chỉ định path cụ thể cho cache

      # 3. Cài đặt các gói phụ thuộc và chạy test
      - name: Install dependencies & Run tests
        run: |
          npm ci
          npm run build
          # npm test || true # Mở comment nếu dự án của bạn có test suite cần chạy trước khi deploy

      # 4. Xác thực thông tin AWS (AWS Credentials)
      # Yêu cầu cài đặt các secrets: AWS_ACCESS_KEY_ID và AWS_SECRET_ACCESS_KEY trên Github Repo Secrets
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # 5. Đăng nhập vào Amazon ECR
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 6. Build Docker Image và Push lên ECR
      # Sẽ đánh tag image gồm tag tĩnh "latest" và tag động là mã Hash của Commit (SHA) để có thể rollback khi cần thiết
      - name: Build, Tag, and Push Image to Amazon ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          # Build Docker image
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:latest -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          
          # Push cả 2 tag lên ECR
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      # 7. Tự động cập nhật Auto Scaling Group (Zero-Downtime Instance Refresh)
      # Bước này sẽ báo cho Auto Scaling Group biết để thực hiện Refresh các EC2 instance.
      # Các EC2 mới sẽ tự động kéo Docker Image mới nhất (tag latest) từ ECR về để chạy.
      # Để bật chức năng này, vui lòng bỏ dấu comment (#) của các dòng lệnh dưới đây:
      # - name: Trigger AWS ASG Instance Refresh
      #   run: |
      #     aws autoscaling start-instance-refresh \
      #       --auto-scaling-group-name ${{ env.ASG_NAME }} \
      #       --preferences '{"MinHealthyPercentage": 50}'
